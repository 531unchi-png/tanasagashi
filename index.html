<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b57"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="description" content="商品名・品番・棚番から在庫の置き場所を検索"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>棚さがし | 在庫ロケーション</title></head>
<body><header><div class="brand"><span class="brandmark">棚</span><div><strong>棚さがし</strong><small>在庫ロケーション</small></div></div><span id="connection" class="connection">読込中</span></header>
<main><section class="search-panel"><label for="query">商品・品番から探す</label><div class="searchbox"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="例：KVK K3、キッツ 20、えるぼ" autocomplete="off" enterkeyhint="search"><button id="clear" aria-label="検索をクリア">×</button></div><p class="hint">品番の一部・メーカー・規格・現場の呼び名でも検索</p></section>
<nav aria-label="表示切替"><button data-tab="map" class="active">場所から探す</button><button data-tab="results">商品一覧 <span id="result-count"></span></button><button data-tab="quality">データ確認</button></nav>
<div id="loading" role="status">商品データと棚番を読み込んでいます…</div>
<section id="map-view" hidden><div class="sectionhead"><h1 id="map-title">レイアウトから探す</h1><span id="total"></span></div><div id="pages" class="chips" aria-label="図面ページ"></div><div id="areas" class="areas" aria-label="エリア"></div><div class="map-grid"><div class="drawing-panel"><div class="drawing-toolbar"><span id="drawing-caption"></span><div><button id="zoom-out" aria-label="図面を縮小">−</button><button id="zoom-in" aria-label="図面を拡大">＋</button></div></div><div class="drawing-scroll" id="drawing-scroll"><div class="drawing" id="drawing"><img id="layout" alt="棚番レイアウト"><div id="hotspots"></div></div></div><p class="hint map-hint">棚をタップして商品を表示。＋で拡大できます。</p></div><aside><div class="sectionhead"><h2 id="shelf-title">棚を選ぶ</h2><button id="reset-filter" class="text-button">解除</button></div><div id="shelves" class="shelves"></div><div id="selection" aria-live="polite"></div><div id="map-products"></div></aside></div></section>
<section id="results-view" hidden><div class="sectionhead"><h1 id="results-title">商品一覧</h1><span id="search-status" role="status"></span></div><div id="filter-summary"></div><div id="results"></div><button id="more" class="more" hidden>さらに50件表示</button></section>
<section id="quality-view" hidden><div class="sectionhead"><h1>元データの確認</h1><a href="data-quality.csv" download>確認一覧を保存</a></div><div id="quality-summary"></div><label class="quality-filter">確認項目 <select id="issue-type"><option value="">すべて</option><option>欠損</option><option>図面位置未確定</option><option>商品コード重複</option></select></label><p id="issue-count"></p><div id="issues"></div></section>
<footer>元データ：新在庫品コード.xlsx / 事務所レイアウト棚番.pdf<br>数量は管理対象外です。表示件数は商品レコード数です。<details><summary>iPhoneでホーム画面に追加</summary><p>Safariで開き、共有メニューから「ホーム画面に追加」を選びます。</p><p>一度読み込むと、この端末に商品と図面を保存します。共用端末では取り扱いにご注意ください。</p><button id="clear-cache">端末に保存したデータを削除</button></details></footer></main><script type="module" src="app.mjs"></script></body></html>
